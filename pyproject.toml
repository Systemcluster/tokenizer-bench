[project]
name = "tokenizer-bench"
description = "Benchmark for tokenizers."
version = "0.0.0"
requires-python = ">=3.12,<3.14"

authors = [{ name = "Christian Sdunek", email = "me@systemcluster.me" }]
urls = { repository = "https://github.com/Systemcluster/tokenizer-bench" }

dependencies = [
    "kitoken>=0.11.0",
    "fastokens>=0.2.0",
    "gigatoken>=0.10.0",
    "sentencepiece>=0.2.2",
    "tokenizers>=0.22.2,<0.23.1",
    "tiktoken>=0.13.0",
    "mistral-common>=1.11.7",
    "llama-models>=0.3.0",
    "transformers>=5.14.1",
    "blobfile>=3.2.0",
    # "gpt_bpe", # vendored
    "scipy>=1.18.0",
    "numpy>=2.3,<2.4; python_version == '3.12'",
    "numpy>=2.5.1; python_version >= '3.13'",
    "rich>=15.0.0",
    "rich-argparse>=1.8.0",
    "pip>=26.1.2",
    "pywin32>=311; platform_system=='Windows'",
]

[project.optional-dependencies]
llama = [
    "llama-cpp-python>=0.3.34",
]
[dependency-groups]
dev = ["ruff>=0.16.0", "pyright>=1.1.411"]

[tool.pdm]
distribution = false
[tool.pdm.resolution]
allow-prereleases = false
[tool.pdm.dev-dependencies]
dev = ["ruff>=0.16.0", "pyright>=1.1.411"]
[tool.rye]
dev-dependencies = ["ruff>=0.16.0", "pyright>=1.1.411"]

[[tool.pdm.source]]
name = "pypi"
url = "https://pypi.org/simple"
verify_ssl = true

[tool.pyright]
include = ["bench", "generate"]
exclude = ["vendor", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryCast = "none"
reportUnnecessaryComparison = "none"
reportUnknownVariableType = "none"
reportIncompatibleMethodOverride = "none"
reportMissingParameterType = "none"

[tool.ruff]
output-format = "pylint"
line-length = 120
exclude = [
    "vendor",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "ANN",
    "ASYNC",
    "SIM",
    "PIE",
    "S",
    "B",
    "A",
    "C4",
    "ERA",
    "T20",
    "PT",
    "PLC",
    "PLE",
    "PLW",
    "Q",
    "I",
    "UP",
    "DTZ",
    "RUF",
]
ignore = [
    "ERA001",
    "PLC0415",
    "SIM115",
    "T201",
    "ANN401",
    "S101",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"
docstring-quotes = "double"
avoid-escape = false

[tool.ruff.lint.isort]
section-order = [
    "future",
    "first-party",
    "local-folder",
    "standard-library",
    "third-party",
]
lines-after-imports = 2
lines-between-types = 1

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.setuptools]
py-modules = []
